# CarbonSpark ships one theme: warm paper, near-black ink, a single clay accent.
# Pinning it means the page never renders its CSS against the wrong ground
# depending on what the viewer's browser or Streamlit profile prefers.
[theme]
base = "light"
primaryColor = "#c1633f"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#f2f0e9"
textColor = "#141413"
font = "sans serif"

[client]
# Streamlit's own "Deploy" button and hamburger sit on top of CarbonSpark's
# toolbar, so the built-in chrome is reduced to the essentials.
toolbarMode = "minimal"
showErrorDetails = true

[server]
runOnSave = false
